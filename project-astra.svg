    <g fill="#9be7ff" font-family="monospace" font-size="17">
      <text x="45" y="89">grub rescue&gt; ls</text>
      <text x="45" y="128">(hd0,gpt2)/</text>
      <text x="45" y="167">set root=(hd0,gpt2)</text>
      <text x="45" y="206">linux /vmlinuz root=/dev/sda2</text>
